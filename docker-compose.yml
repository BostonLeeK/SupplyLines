# The game server in one container (the global war), plus an optional blitz world with 15-minute seasons.
# Put them behind the web server / reverse proxy you already run, or open the ports directly.
#   docker compose up -d --build
services:
  game:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5177}:5177"
    environment:
      - SIM_SPEED=${SIM_SPEED:-0.125}
      - CP_SECONDS=${CP_SECONDS:-45}
      - BOTS=${BOTS:-120}
      - FAST_URL=${FAST_URL:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - PRIVATE_GAMES=${PRIVATE_GAMES:-3}
      - ALERTS_URL=${ALERTS_URL:-}
      - STATS_KEY=${STATS_KEY:-}
      - CONTACT_TG_TOKEN=${CONTACT_TG_TOKEN:-}
      - CONTACT_TG_CHAT=${CONTACT_TG_CHAT:-}
    volumes:
      - game-data:/data
  # Blitz: a separate world where a season lasts 15 minutes (SIM_SPEED 1; one CP every 6 s keeps about as many CP per
  # season as the 2-hour war). Proxy /fast/ to it and set FAST_URL=/fast/ so the start screen offers both modes. Its players, ranks and seasons are kept apart from the main war.
  fast:
    build: .
    restart: unless-stopped
    ports:
      - "${FAST_HOST_PORT:-5178}:5177"
    environment:
      - ROOM=fast
      - SIM_SPEED=${FAST_SIM_SPEED:-1}
      - CP_SECONDS=${FAST_CP_SECONDS:-6}
      - BOTS=${BOTS:-120}
      - MAIN_URL=${MAIN_URL:-/}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ALERTS_URL=${ALERTS_URL:-}
      - STATS_KEY=${STATS_KEY:-}
      - CONTACT_TG_TOKEN=${CONTACT_TG_TOKEN:-}
      - CONTACT_TG_CHAT=${CONTACT_TG_CHAT:-}
    volumes:
      - fast-data:/data
volumes:
  game-data:
  fast-data:
