# The game server in one container, plus an optional fast room for quick tests.
# Put them behind the web server / reverse proxy you already run, or open the ports directly.
#   docker compose up -d --build
services:
  game:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5177}:5177"
    environment:
      - SIM_SPEED=${SIM_SPEED:-0.125}
      - CP_SECONDS=${CP_SECONDS:-45}
      - BOTS=${BOTS:-120}
      - FAST_URL=${FAST_URL:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - game-data:/data
  # A separate world where a season lasts about 30 minutes (SIM_SPEED 0.5). Proxy /fast/ to it and set FAST_URL=/fast/
  # so the main page offers it. Its players, ranks and seasons are kept apart from the main war.
  fast:
    build: .
    restart: unless-stopped
    ports:
      - "${FAST_HOST_PORT:-5178}:5177"
    environment:
      - ROOM=fast
      - SIM_SPEED=${FAST_SIM_SPEED:-0.5}
      - CP_SECONDS=${FAST_CP_SECONDS:-15}
      - BOTS=${BOTS:-120}
      - MAIN_URL=${MAIN_URL:-/}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - fast-data:/data
volumes:
  game-data:
  fast-data:
